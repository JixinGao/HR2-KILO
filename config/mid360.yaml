common:
  lid_topic:  "/livox/lidar" 
  imu_topic:  "/livox/imu" 
  encoder_topic: "/g1/joint_state"
  imu_freq: 200
  joint_freq: 1000
 
preprocess:
  lidar_type: 1 
  scan_line: 4
  timestamp_unit: 1 # the unit of time/t field in the PointCloud2 rostopic: 0-second, 1-milisecond, 2-microsecond, 3-nanosecond.
  blind: 0.5 
 
mapping:
  lidar_time_inte: 0.1
  satu_acc: 30.0 # the saturation value of IMU's acceleration. not related to the units
  satu_gyro: 35 # the saturation value of IMU's angular velocity. not related to the units
  acc_norm: 1.0 # 1.0 for g as unit, 9.81 for m/s^2 as unit of the IMU's acceleration
  lidar_meas_cov: 0.003 # 0.001; 0.01
  b_acc_cov: 0.0001 
  b_gyr_cov: 0.0001 
  b_pc_cov: 0.01
  imu_meas_acc_cov: 0.8
  imu_meas_omg_cov: 0.5
  joint_meas_vel_cov: 2
  joint_meas_pos_cov: 2
  plane_thr: 0.1 # 0.05, the threshold for plane criteria, the smaller, the flatter a plane
  match_s: 81
  ivox_grid_resolution: 2.0
  gravity: [0.0, 0.0, 9.810]
  extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
  extrinsic_R: [ 1, 0, 0, 0, 1, 0, 0, 0, 1 ]
  extrinsic_Rfl: [ 1, 0, 0, 0, -1, 0, 0, 0, -1 ] # 0.998863852, 0.0, -0.0476550637, 0.0, -1.0, 0.0, -0.0476550637, 0.0, -0.998863852

robot:
  sensor_height: 1.1
  gait_cut: 5                   # 4, 5, 7(long corr)
  height_thres_min: 0.05        # base threshold for foot lift detection (gait)
  height_thres_max: 10.0        # (ground plane search)
  vfov_lidar: 45
  enable_HandleSet: true
  enable_SingleDir: false   
  refswing_multi: 2.1      # lower -> increase sensitive, higher reduce
  solediff2model: 0.085    # diff between the foot in model and the actual sole
  max_clearance_ratio: 0.9 # the ratio of the 2nd to the 1st max clearance (for swing phase)

odometry: 
  publish_odometry_without_downsample: false # enable high rate
 
publish:
  path_en: true                 # false: close the path output
  scan_publish_en: true         # false: close all the point cloud output
  scan_bodyframe_pub_en: false  # true: output the point cloud scans in IMU-body-frame
 
pcd_save:
  pcd_save_en: false
  interval: -1                 # how many LiDAR frames saved in each pcd file; 
                               # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
